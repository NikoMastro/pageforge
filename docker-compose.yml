services:
  # Showcase storage: MongoDB replaces Firestore (see backend/mongoutils/storage.js)
  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    ports:
      - "8080:8080"
    volumes:
      - ./backend:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - PORT=8080
      - MONGODB_URI=mongodb://mongodb:27017
      - MONGODB_DB=pageforge
    depends_on:
      - mongodb
    restart: on-failure
    command: npm run dev

  # --- Original Firestore emulator setup (production stack) — kept for reference ---
  # firestore:
  #   image: spine3/firebase-emulator
  #   ports:
  #     - "8082:8082"
  #     - "9099:9099"  # Auth
  #   volumes:
  #     - ./firestore-data:/firebase-data
  #     - ./app/frontend/firebase.json:/home/node/firebase.json:ro
  #     - ./app/frontend/firestore.rules:/home/node/firestore.rules:ro
  #     - ./app/frontend/firestore.indexes.json:/home/node/firestore.indexes.json:ro
  #   working_dir: /home/node
  #
  # backend (Firestore mode) environment — kept for reference:
  #   - FIRESTORE_EMULATOR_HOST=firestore:8082
  #   - FIRESTORE_DATABASE_ID=(default)
  #   - GCP_PROJECT_ID=pageforge-local

volumes:
  mongo-data:
