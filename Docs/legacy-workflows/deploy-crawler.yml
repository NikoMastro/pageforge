name: Deploy Crawler Cloud Function

on:
  push:
    branches:
      - develop
      - main
    paths:
      - "crawler/**"
      - ".github/workflows/deploy-crawler.yml"

# Cancel in-progress runs for the same workflow
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            crawler
            .github/workflows/deploy-crawler.yml

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: "projects/${{ vars.GCP_PROJECT_NUMBER }}/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider"
          service_account: "pageforge-github-actions@${{ vars.GCP_PROJECT_ID }}.iam.gserviceaccount.com"

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: './crawler/package-lock.json'

      - name: Build TypeScript
        working-directory: ./crawler
        run: npm ci --prefer-offline --no-audit --no-fund && npm run build

      - name: Deploy Crawler Cloud Function
        run: |
          gcloud functions deploy ${{ vars.CRAWLER_FUNCTION_NAME }} \
            --gen2 \
            --region=${{ vars.REGION }} \
            --source=./crawler \
            --runtime=nodejs20 \
            --entry-point=analyzeUrl \
            --quiet

      - name: Job Summary
        run: |
          echo "### Crawler Function Deployment Summary :rocket:" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ **Deployment Successful**" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment**: ${{ github.ref == 'refs/heads/main' && 'production' || 'development' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Project**: ${{ vars.GCP_PROJECT_ID }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Function Name**: \`${{ vars.CRAWLER_FUNCTION_NAME }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Region**: ${{ vars.REGION }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Runtime**: nodejs20" >> $GITHUB_STEP_SUMMARY
          echo "- **Generation**: Gen2" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY

